<div class="redaction-panel">
  <h3>Redaction Panel:</h3>

  <div class="redaction-types">
    <div
      *ngFor="let redactionType of redactionTypes"
      class="redaction-type-item"
    >
      <label
        [for]="getCheckboxId(redactionType.type)"
        class="redaction-label"
      >
        <input
          type="checkbox"
          [id]="getCheckboxId(redactionType.type)"
          [(ngModel)]="selectedTypes[redactionType.type]"
          [attr.aria-label]="redactionType.label + ' - ' + redactionType.description"
          class="redaction-checkbox"
        />
        <i *ngIf="redactionType.type === 'Private'" class="fa-solid fa-shield" style="color: #ff3333;"></i>
        <i *ngIf="redactionType.type === 'Privileged'" class="fa-solid fa-crown" style="color: #0091ff;"></i>
        <i *ngIf="redactionType.type === 'Highlight'" class="fa-solid fa-highlighter" style="color: #ebb800;"></i>
        <i *ngIf="redactionType.type === 'Privacy-Foreign'" class="fa-solid fa-globe" style="color: #02a23a;"></i>
        <span class="redaction-label-text">{{ redactionType.label }}</span>
      </label>
    </div>
  </div>

  <div class="action-buttons">
    <div class="apply-combo-group">
      <button
        class="apply-button"
        (click)="onApply()"
        [disabled]="isApplyDisabled()"
        [attr.aria-disabled]="isApplyDisabled()"
        aria-label="Apply selected redaction types to selected text"
      >
        Apply to Selected Text
      </button>
      <button
        class="apply-dropdown-trigger"
        (click)="toggleApplyDropdown()"
        [disabled]="isApplyDisabled()"
        [attr.aria-disabled]="isApplyDisabled()"
        aria-haspopup="menu"
        [attr.aria-expanded]="showApplyDropdown"
        aria-label="Apply scope options"
      >
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div
        *ngIf="showApplyDropdown"
        class="apply-dropdown-menu"
        role="menu"
        aria-label="Apply scope menu"
        (keydown)="onDropdownKeydown($event)"
        tabindex="-1"
      >
        <button
          class="dropdown-item"
          (click)="onApplyToSelected()"
          role="menuitem"
          aria-label="Apply to selected instance"
          tabindex="0"
        >
          Apply to Selected Text
        </button>
        <button
          class="dropdown-item"
          (click)="onApplyToAllInActivity()"
          role="menuitem"
          aria-label="Apply to all instances in this activity"
          tabindex="0"
        >
          Apply to All Instances in This Activity
        </button>
        <button
          class="dropdown-item disabled"
          disabled
          role="menuitem"
          aria-label="Apply to all instances in other activities - not available"
          aria-disabled="true"
          tabindex="-1"
        >
          Apply to All Instances in All Activities
        </button>
      </div>
    </div>

    <button
      class="next-button"
      (click)="onNext()"
      [disabled]="isNextDisabled()"
      [attr.aria-disabled]="isNextDisabled()"
      aria-label="Navigate to next instance of selected word"
    >
      Apply to Next Instance
    </button>

    <div class="delete-combo-group">
      <button
        class="delete-button"
        (click)="onDelete()"
        [disabled]="isDeleteDisabled()"
        [attr.aria-disabled]="isDeleteDisabled()"
        aria-label="Delete selected redaction"
      >
        Delete
      </button>
      <button
        class="delete-dropdown-trigger"
        (click)="toggleDeleteDropdown()"
        [disabled]="isDeleteDisabled()"
        [attr.aria-disabled]="isDeleteDisabled()"
        aria-haspopup="menu"
        [attr.aria-expanded]="showDeleteDropdown"
        aria-label="Delete scope options"
      >
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div
        *ngIf="showDeleteDropdown"
        class="delete-dropdown-menu"
        role="menu"
        aria-label="Delete scope menu"
        (keydown)="onDeleteDropdownKeydown($event)"
        tabindex="-1"
      >
        <button
          class="dropdown-item"
          (click)="onDeleteSelected()"
          role="menuitem"
          aria-label="Delete selected instance"
          tabindex="0"
        >
          Delete
        </button>
        <button
          class="dropdown-item"
          (click)="onDeleteAllInActivity()"
          role="menuitem"
          aria-label="Delete all instances in this activity"
          tabindex="0"
        >
          Delete All Instances In This Activity
        </button>
        <button
          class="dropdown-item disabled"
          disabled
          role="menuitem"
          aria-label="Delete all instances in all activities - not available"
          aria-disabled="true"
          tabindex="-1"
        >
          Delete All Instances in All Activities
        </button>
      </div>
    </div>

    <a
      class="remove-all-link"
      [class.disabled]="!hasAnyRedactions"
      (click)="onRemoveAllRedactions($event)"
      (keydown)="onRemoveAllRedactionsKeyboard($event)"
      [attr.tabindex]="hasAnyRedactions ? 0 : -1"
      [attr.aria-disabled]="!hasAnyRedactions"
      aria-label="Remove all redaction types from this activity"
      role="button"
    >
      <i class="fa-solid fa-trash" aria-hidden="true"></i>
      Remove all redaction types from this activity
    </a>
  </div>
