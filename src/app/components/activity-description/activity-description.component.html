<div class="activity-panel">
  <div class="activity-header collapsible" (click)="toggleExpanded()">
    <h2>Activity UID: {{ activity.uid }}</h2>
    <span class="caret-icon" [class.expanded]="isExpanded">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
  </div>

  <div class="expandable-content" *ngIf="isExpanded">
    <div class="content-split">
      <div class="left-content">
        <div class="detail-row">
          <span class="detail-label">Priority:</span>
          <span class="priority-badge" [class]="'priority-' + activity.priority.toLowerCase()">
            {{ activity.priority }}
          </span>
        </div>

        <div class="detail-row">
          <span class="detail-label">Workflow Tags:</span>
          <span *ngFor="let tag of activity.workflowTags" class="workflow-tag">
            {{ tag }}
          </span>
        </div>
        
        <div class="description-section">
          <h3>Description:</h3>
          <p class="help-text">Select text in the description to apply redactions.</p>
          <div
            id="activity-description"
            class="description-text"
            (mouseup)="onTextSelection()"
            (keyup)="onTextSelection()"
            (contextmenu)="onContextMenu($event)"
            (keydown)="onDescriptionKeydown($event)"
            role="article"
            aria-label="Activity description - selectable text for redaction"
          >
            <ng-container *ngFor="let segment of segments; let i = index">
              <span
                *ngIf="!segment.isRedacted"
                [id]="getSegmentId(i)"
              >{{ segment.text }}</span>
              <mark
                *ngIf="segment.isRedacted"
                [id]="getSegmentId(i)"
                [ngStyle]="getSegmentStyle(segment)"
                [attr.aria-describedby]="getTooltipId(i)"
                class="redacted-text"
                tabindex="0"
                role="mark"
                [attr.aria-label]="'Redacted text with types: ' + getTooltipText(segment)"
                (click)="onSegmentClick(segment)"
                (focus)="onSegmentFocus(segment)"
              >{{ segment.text }}<span [id]="getTooltipId(i)" class="tooltip-content" role="tooltip">
                <div class="tooltip-redaction-list">
                  <div *ngFor="let type of segment.redactionTypes" class="tooltip-redaction-item">
                    <span class="redaction-type-label">{{ type }}</span>
                    <button
                      type="button"
                      class="remove-redaction-btn"
                      (click)="onRemoveRedaction(segment, type, $event)"
                      (keydown)="onRemoveRedactionKeyboard(segment, type, $event)"
                      [attr.aria-label]="'Remove ' + type + ' redaction'"
                      tabindex="0"
                    >×</button>
                  </div>
                </div>
              </span></mark>
            </ng-container>
          </div>
        </div>

        <div class="activity-meta">
          <div class="detail-row">
            <span class="detail-label">Created Time:</span>
            <span>{{ activity.createdTime }}</span>
          </div>
        </div>
      </div>
      

      <div class="right-content">
        <app-redaction-panel
          [hasSelection]="hasSelection"
          [selectedRedactedRange]="selectedRedactedRange"
          [selectedText]="selectedText"
          [nextButtonEnabled]="nextButtonEnabled"
          (applyRedactions)="onApplyRedactionsInternal($event)"
          (applyToAllInstances)="onApplyToAllInstances($event)"
          (deleteRedactions)="onDeleteRedactions()"
          (deleteAllInstancesInActivity)="onDeleteAllInstancesInActivity()"
          (navigateToNext)="onNavigateToNext()"
        ></app-redaction-panel>
      </div>
    </div>
  </div>
</div>

<div
  *ngIf="showContextMenu"
  class="context-menu-overlay"
  (click)="hideContextMenu()"
>
  <div
    class="context-menu"
    [style.left.px]="contextMenuX"
    [style.top.px]="contextMenuY"
    (click)="$event.stopPropagation()"
    (keydown)="onContextMenuKeydown($event)"
    role="menu"
    aria-label="Redaction context menu"
    tabindex="-1"
  >
    <div class="context-menu-header">Add Redaction</div>
    <div
      *ngFor="let type of redactionTypes"
      class="context-menu-item"
      [class.disabled]="isRedactionDisabled(type)"
      role="menuitem"
      [attr.aria-disabled]="isRedactionDisabled(type)"
    >
      <span class="redaction-type-name">{{ type }}</span>
      <button
        type="button"
        class="add-redaction-btn"
        (click)="onAddRedactionFromContext(type, $event)"
        (keydown)="onAddRedactionKeyboard(type, $event)"
        [attr.aria-label]="'Add ' + type + ' redaction'"
        [disabled]="isRedactionDisabled(type)"
        tabindex="0"
      >+</button>
    </div>
  </div>
</div>
